name: ⭐ 功能请求 / Feature request
description: 提议改进 Koharia / Suggest an improvement for Koharia
labels: [feature request]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 Issue。请说明需求背后的问题或使用场景，方便我们结合上下文评估。
        Please search existing issues before submitting. Include the problem or use case behind your request so it can be evaluated in context.

  - type: textarea
    id: feature-description
    attributes:
      label: 希望改进什么？ / What would you like to change?
      description: 请描述问题、使用场景以及希望看到的结果。 / Describe the problem, use case, and the result you would like to see.
      placeholder: |
        要解决什么问题？ / What problem would this solve?
        希望 Koharia 如何工作？ / What would you like Koharia to do?
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: 补充信息 / Additional context
      description: 如有助于说明需求，请补充示例、截图、链接或其他信息。 / Add examples, screenshots, links, or other details if they help explain the request.
      placeholder: |
        可选：示例、截图或相关应用。 / Optional: examples, screenshots, or related apps.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 快速确认 / Quick check
      options:
        - label: 我已搜索现有 Issue，确认这不是重复请求。 / I have searched existing issues and this request is not a duplicate.
          required: true
