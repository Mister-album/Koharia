name: 🐞 问题反馈 / Issue report
description: 报告 Koharia 中的问题 / Report a problem in Koharia
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue，并尽可能使用最新的 Koharia 构建版本。请注明库类型；涉及服务器时提供其版本。无需为了反馈问题测试所有库，请勿提供凭据或私人服务器信息。
        Please search existing issues first and use the latest available Koharia build when possible. Identify the provider and server version when relevant. You do not need to test every provider; do not include credentials or private server information.

  - type: textarea
    id: issue-description
    attributes:
      label: 发生了什么？ / What happened?
      description: 请描述当时的操作和出现的问题；如有帮助，请补充复现步骤、预期结果和实际结果。 / Describe what you were doing and what went wrong. Include steps to reproduce, expected behavior, and actual behavior when useful.
      placeholder: |
        复现步骤 / Steps:
        1.
        2.

        预期结果 / Expected:

        实际结果 / Actual:
    validations:
      required: true

  - type: textarea
    id: crash-logs
    attributes:
      label: 崩溃日志 / Crash logs
      description: |
        如遇到崩溃，请尽可能前往应用的 **More → Settings → Advanced（更多 → 设置 → 高级）** 页面，点击 **Dump crash logs（导出崩溃日志）**，并在此分享日志。
        If you're experiencing crashes, if possible, go to the app's **More → Settings → Advanced** page, press **Dump crash logs** and share the crash logs here.
      placeholder: |
        可选：上传崩溃日志文件，或粘贴相关日志。 / Optional: upload the crash log file or paste the relevant logs here.

  - type: input
    id: koharia-version
    attributes:
      label: Koharia 版本 / Koharia version
      description: 可在 **More → About（更多 → 关于）** 中查看 Koharia 版本。 / You can find your Koharia version in **More → About**.
      placeholder: |
        示例 / Example: 0.20.1
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境 / Environment
      description: 请填写设备、Android 版本、库类型，以及相关的服务器版本、内容格式和操作入口。权限只需描述相关能力，不要填写账号或凭据。 / Include your device, Android version, provider, and relevant server version, content format, and entry point. Describe relevant permissions without account details or credentials.
      placeholder: |
        设备 / Device:
        Android 版本 / Android:
        库类型（服务器类型或本地目录） / Provider (server type or local folder):
        服务器版本（如适用） / Server version (if relevant):
        内容格式 / Content format:
        操作入口（书架、搜索、详情、阅读器等） / Entry point (shelf, search, details, reader, etc.):
        相关权限（如允许下载、只读） / Relevant permissions (e.g. download allowed, read-only):
        其他库是否出现（可选，无需额外测试） / Other providers affected (optional, no extra testing required):
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: 补充信息 / Additional context
      description: 请补充有助于调查问题的截图、文件、链接或其他信息。 / Add screenshots, files, links, or anything else that may help investigate the problem.
      placeholder: |
        可选：截图、示例文件或相关信息。 / Optional: screenshots, sample files, or related details.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 快速确认 / Quick check
      options:
        - label: 我已搜索现有 Issue，确认这个问题尚未被报告。 / I have searched existing issues and this problem is not already reported.
          required: true
