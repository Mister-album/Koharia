android.nonTransitiveRClass=false

# Preserve manually installed apps and their data when running device tests.
android.injected.androidTest.leaveApksInstalledAfterRun=true
android.experimental.testOptions.uninstallIncompatibleApks=false
android.testInstrumentationRunnerArguments.clearPackageData=false

kotlin.code.style=official

# Configuration should be synced with [/gradle/build-logic/gradle.properties]
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
